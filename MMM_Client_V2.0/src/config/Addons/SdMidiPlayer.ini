; Optional Teensy 4.1 SD MIDI playback. Compose these flags in a Teensy profile.
[SdMidiPlayer]
build_flags =
    -D CFG_EXTRA_SD_MIDI_PLAYER
    -D CFG_SD_MIDI_AUTOPLAY=1 ; Default true when omitted
    -D CFG_SD_MIDI_LOOP=1 ; Default true when omitted
    -D CFG_SD_MIDI_DELAY_SECONDS=0 ; Automatic starts only; 0..86400

[env:SdMidiPlayer_teensy41]
extends = teensy41, Teensy41HwPwm_teensy41
build_flags =
    ${Teensy41HwPwm_teensy41.build_flags}
    ${SdMidiPlayer.build_flags}
