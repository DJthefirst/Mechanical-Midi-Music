; PlatformIO Project Esp32S3HwPwm Configuration File

[Esp32S3HwPwm]
#---------- Device Configuration ----------
device_cfg =
    -D CFG_DEVICE_NAME="\"ESP32-S3 HW PWM\""
    -D CFG_DEVICE_ID=0x001A

#---------- Instrument Configuration ----------
instrument_cfg =
    -D CFG_INSTRUMENT_HWPWM
    -D CFG_INSTRUMENT_TYPE_VALUE="\"Instruments/Base/HwPWM/HwPWM.h\""
    -D CFG_NUM_SUBINSTRUMENTS=1
    -D CFG_MIN_NOTE=0
    -D CFG_MAX_NOTE=127
    -D CFG_NOTE_TIMEOUT_MS=10000

#---------- Network Configuration ----------
network_serial =
    -D CFG_MMM_NETWORK_SERIAL
    -D CFG_MMM_NETWORK_SERIAL_BAUD=115200

network_udp =
    -D CFG_MMM_NETWORK_UDP
    -D CFG_MMM_NETWORK_UDP_AsyncWebServer_PORT=80
    -D CFG_MMM_NETWORK_UDP_ADDRESS="{224, 5, 6, 7}"
    -D CFG_MMM_NETWORK_UDP_OTA_PORT=8337

network_usb =
    -D CFG_MMM_NETWORK_USB
    ; -D CFG_USB_MIDI_PID=0x4001 ; Optional custom USB product ID

network_din =
    -D CFG_MMM_NETWORK_DIN

#---------- Components Configuration ----------
component_pwm =
    -D CFG_COMPONENT_PWM
    -D CFG_PWM_TYPE=HW_ACCEL
    ; Hardware timer/pin map is defined per-board in each HW section

#---------- Extras Configuration ----------
extra_local_storage =
    -D CFG_EXTRA_LOCAL_STORAGE

extra_addr_leds =
    -D CFG_EXTRA_ADDRESSABLE_LEDS
    -D CFG_NUM_LEDS=64
    -D CFG_BRIGHTNESS=255
    -D CFG_LED_TYPE=WS2811
    -D CFG_COLOR_ORDER=GRB
    -D CFG_UPDATES_PER_SECOND=10

#---------- PlatformIO Configuration ----------
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ${Esp32S3HwPwm.device_cfg}
    ${Esp32S3HwPwm.instrument_cfg}

    ${Esp32S3HwPwm.network_serial} ; UART0 (DevKitC "UART" USB port, GPIO43/44)
    ; ${Esp32S3HwPwm.network_udp}
    ${Esp32S3HwPwm.network_usb}    ; Native USB MIDI (DevKitC "USB" port, GPIO19/20)
    ; ${Esp32S3HwPwm.network_din}

    ${Esp32S3HwPwm.component_pwm}
    ${Esp32S3HwPwm.extra_local_storage}  ; Persist device + distributor config in NVS
    ; ${Esp32S3HwPwm.extra_addr_leds}

monitor_speed = 115200

########## ESP32-S3 DevKitC-1 CONFIGURATION ##########
[Esp32S3HwPwm_esp32s3]
extends = Esp32S3HwPwm

#---------- Hardware Configuration ----------
; 4 independent voices, one LEDC timer each (the ESP32-S3 has only 4 LEDC timers).
; Avoid GPIO 0/3/45/46 (strapping), 19/20 (USB), 43/44 (UART0),
; 26-32 (flash/PSRAM, plus 33-37 on octal-PSRAM modules) and 38/48 (onboard RGB LED).
build_unflags =
    ${Esp32S3HwPwm.build_unflags}
    ${esp32s3.build_unflags}
build_flags =
    ${Esp32S3HwPwm.build_flags}
    ${esp32s3.build_flags}
    -D CFG_ESP32_S3
    -D CFG_NUM_INSTRUMENTS=4
    -D CFG_TIMER_RESOLUTION_US=8
    -D CFG_PINS_INSTRUMENT_PWM="4,5,6,7"
    -D CFG_PIN_LED_DATA=21
